name: seelo 자동 배포

on:
  push:
    branches: [backend-0-13]
    paths:
      - '04_MVP/seelo/**'
      - '.github/workflows/deploy-seelo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seelo-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: 04_MVP/seelo/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.9'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check . ../infra/scripts/deploy.py ../infra/scripts/register-ci-key.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5432/test

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/backend-0-13'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: seelo-prod-20261030
      GCP_ZONE: asia-northeast3-a
      GCP_VM: seelo-prod
      VM_ID: '3258386700300811639'
      DEPLOY_SHA: ${{ github.sha }}
      SSH_HOST_KEY: ${{ vars.SEELO_SSH_HOST_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: seelo-prod-20261030
          workload_identity_provider: ${{ vars.SEELO_WIF_PROVIDER }}
          service_account: seelo-github-deploy@seelo-prod-20261030.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: 커밋 패키지·서버 호스트 키 준비
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          test -n "$SSH_HOST_KEY"
          mkdir -p "$HOME/.ssh"
          printf 'seelo-prod %s\n' "$SSH_HOST_KEY" > "$RUNNER_TEMP/seelo-known-hosts"
          chmod 600 "$RUNNER_TEMP/seelo-known-hosts"
          ssh-keygen -q -t ed25519 -N '' -C seelo-ci -f "$RUNNER_TEMP/seelo-ci-key"
          python3 04_MVP/seelo/infra/scripts/register-ci-key.py --project "$GCP_PROJECT" \
            --zone "$GCP_ZONE" --instance "$GCP_VM" --public-key "$RUNNER_TEMP/seelo-ci-key.pub"
          git archive --format=tar.gz "$DEPLOY_SHA:04_MVP/seelo" > "$RUNNER_TEMP/seelo.tar.gz"
          sha256sum "$RUNNER_TEMP/seelo.tar.gz" | cut -d' ' -f1 > "$RUNNER_TEMP/seelo.sha256"
      - name: IAP로 패키지 전달·배포
        shell: bash
        run: |
          set -euo pipefail
          proxy="gcloud compute start-iap-tunnel $GCP_VM %p --listen-on-stdin --project=$GCP_PROJECT --zone=$GCP_ZONE --verbosity=warning"
          common=(-T -i "$RUNNER_TEMP/seelo-ci-key" -o BatchMode=yes -o IdentitiesOnly=yes
                  -o StrictHostKeyChecking=yes -o HostKeyAlias=seelo-prod
                  -o UserKnownHostsFile="$RUNNER_TEMP/seelo-known-hosts" -o ProxyCommand="$proxy")
          ready=0
          for attempt in 1 2 3 4 5 6; do
            if ssh "${common[@]}" ubuntu@seelo-prod true; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
          remote="/home/ubuntu/seelo-ci/$DEPLOY_SHA-$GITHUB_RUN_ATTEMPT"
          ssh "${common[@]}" ubuntu@seelo-prod \
            "umask 077; mkdir -p '$remote'; cat > '$remote/deploy.py'" < 04_MVP/seelo/infra/scripts/deploy.py
          ssh "${common[@]}" ubuntu@seelo-prod \
            "umask 077; cat > '$remote/source.tar.gz'" < "$RUNNER_TEMP/seelo.tar.gz"
          checksum=$(cat "$RUNNER_TEMP/seelo.sha256")
          ssh "${common[@]}" ubuntu@seelo-prod \
            "sudo python3 '$remote/deploy.py' --bundle '$remote/source.tar.gz' --sha256 '$checksum' --commit '$DEPLOY_SHA'"
      - name: 외부 HTTPS·프로토타입 링크 확인
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a': self.hrefs.append(dict(attrs).get('href'))
          expected=Links()
          expected.feed(Path('04_MVP/seelo/infra/nginx/html/index.html').read_text())
          with urllib.request.urlopen('https://seelo.site/') as response:
              page=response.read().decode()
          actual=Links(); actual.feed(page)
          assert '피그마 프로토타입' in page and expected.hrefs[0] in actual.hrefs
          with urllib.request.urlopen('https://seelo.site/deployment.json') as response:
              assert json.load(response)['commit'] == os.environ['DEPLOY_SHA']
          with urllib.request.urlopen('https://seelo.site/api/health') as response:
              assert json.load(response) == {'status':'ok','db':'ok'}
          print('HTTPS·DB·배포 커밋·피그마 프로토타입 링크 확인 완료')
          PY
