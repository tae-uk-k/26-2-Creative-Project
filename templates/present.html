<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대본 텔레프롬프터 (한 줄 자동 재생)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='present.css') }}">
</head>
<body>
    <main>
        <h1>대본 텔레프롬프터 (한 줄 자동 재생)</h1>
        <p class="desc">대본을 입력하고 저장하면, 아래 화면에 문장이 한 줄씩 나타났다가 사라집니다. (<a href="/">기존 버전으로</a>)</p>

        <div class="upload">
            <textarea id="script-input" rows="6" placeholder="발표 대본을 입력하세요. (문장 단위로 자동 분리됩니다)"></textarea>
            <button type="button" onclick="saveScript()">텍스트 저장하고 보기</button>

            <div class="divider">또는</div>

            <div class="file-row">
                <input type="file" id="pdf-input" accept="application/pdf">
                <button type="button" onclick="uploadPdf()">PDF 업로드</button>
            </div>
            <p id="file-status" class="file-status"></p>
        </div>

        <div class="stage-wrap">
            <div id="stage-status">0 / 0</div>
            <div class="stage">
                <p id="stage-line" class="stage-line"></p>
            </div>
            <div class="stage-controls">
                <button type="button" onclick="prevLine()">이전</button>
                <button type="button" id="play-btn" onclick="togglePlay()">자동재생 시작</button>
                <button type="button" onclick="nextLine()">다음</button>
            </div>
            <div class="speed-row">
                <label for="interval-input">줄 간격(초)</label>
                <input type="number" id="interval-input" min="0.5" step="0.5" value="2.5">
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='present.js') }}"></script>
</body>
</html>
