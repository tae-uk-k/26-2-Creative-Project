<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#ede6db"/><rect x="25" y="25" width="750" height="950" fill="#fffdf7" stroke="#b8ac98"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="64" y="102" font-size="37" font-weight="700" fill="#342d26">온담식탁 성수점</text><text x="64" y="153" font-size="23" fill="#776c5d">메뉴 · 1</text><path d="M64 180H736" stroke="#b8ac98"/><text x="64" y="230" font-size="25" fill="#342d26">들깨수제비 9,000원 · 1인분 · 매장에서 반죽한</text><text x="64" y="272" font-size="25" fill="#342d26">수제비 · 공깃밥 포함</text><text x="64" y="314" font-size="25" fill="#342d26"></text><text x="64" y="356" font-size="25" fill="#342d26">매콤제육정식 11,000원 · 1인분 · 돼지고기</text><text x="64" y="398" font-size="25" fill="#342d26">200g · 공깃밥과 밑반찬 3종 포함</text><text x="64" y="440" font-size="25" fill="#342d26"></text><text x="64" y="482" font-size="25" fill="#342d26">온담 2인 세트 28,000원 · 2인 세트 총액 ·</text><text x="64" y="524" font-size="25" fill="#342d26">들깨수제비 1개 + 제육볶음 400g + 공깃밥</text><text x="64" y="566" font-size="25" fill="#342d26">2개.</text><text x="64" y="608" font-size="25" fill="#342d26"></text><text x="64" y="938" font-size="19" fill="#8c8274">정비 예시용 가상 메뉴판</text></g></svg>