<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#ede6db"/><rect x="25" y="25" width="750" height="950" fill="#fffdf7" stroke="#b8ac98"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="64" y="102" font-size="37" font-weight="700" fill="#342d26">소담면가 망원점</text><text x="64" y="153" font-size="23" fill="#776c5d">주문 안내 · 2</text><path d="M64 180H736" stroke="#b8ac98"/><text x="64" y="230" font-size="25" fill="#342d26">돈가스는 주문 후 매장에서 튀깁니다</text><text x="64" y="272" font-size="25" fill="#342d26"></text><text x="64" y="314" font-size="25" fill="#342d26">소담 점심세트는 평일 11:30~14:00에만</text><text x="64" y="356" font-size="25" fill="#342d26">판매합니다</text><text x="64" y="398" font-size="25" fill="#342d26"></text><text x="64" y="440" font-size="25" fill="#342d26">점심세트의 냉메밀소바를 유부우동으로 변경하면</text><text x="64" y="482" font-size="25" fill="#342d26">500원이 추가됩니다.</text><text x="64" y="524" font-size="25" fill="#342d26"></text><text x="64" y="938" font-size="19" fill="#8c8274">정비 예시용 가상 메뉴판</text></g></svg>