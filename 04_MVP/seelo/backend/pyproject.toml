[project]
name = "seelo-backend"
version = "0.1.0"
description = "seelo beta backend (FastAPI + PostgreSQL + Procrastinate)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "procrastinate>=2.14",
    "httpx>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "structlog>=24.1",
    "openai>=1.50",
    "google-genai>=1.0",
    "google-auth>=2.30",
    "selectolax>=0.3",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "sentry-sdk[fastapi]>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "time-machine>=2.14",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
]
browser = [
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seelo"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E701", "E702"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입은 기본값 자리에 Depends(...)를 쓰는 것이 정식 방법이다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: real external APIs (needs keys)"]
addopts = "-m 'not live'"
