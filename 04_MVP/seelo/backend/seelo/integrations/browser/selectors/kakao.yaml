  row: ""
  name: ""
  link: ""
  external_ref: ""
attention:
  no_owner_authority: ""   # 정보 수정 권한 없음 표시
# 한 줄 소개(intro)만 입력 칸 하나다. 영업시간·가격 정보·링크·서비스·태그는 실제 화면을 본 뒤
# kakao_partner.py에 칸별 함수로 더한다. 그 전에는 수동 처리.
fields:
  intro: { read: "", open_editor: "", input: "", save: "", saved_ready: "", review_badge: "" }
