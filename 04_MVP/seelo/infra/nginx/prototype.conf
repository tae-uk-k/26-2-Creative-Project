# 제출용 고정 주소. 피그마가 바뀌면 아래 목적지만 수정해 운영 브랜치에 배포한다.
location ~ ^/prototype/?$ {
  # 영구 이동·캐시를 쓰면 이전 피그마로 계속 연결될 수 있다.
  add_header Cache-Control "no-store" always;
  # location의 add_header는 상위 헤더를 상속하지 않으므로 보안 헤더도 유지한다.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  return 302 "https://www.figma.com/proto/M5WCPZN32W6PEeIaEvcRkC/%EC%B0%BD%EC%9D%98%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8?page-id=223%3A541&node-id=713-648&starting-point-node-id=713%3A648&scaling=fit-width&content-scaling=fixed&hide-ui=1";
}
