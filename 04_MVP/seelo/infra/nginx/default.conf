# /api → FastAPI, 나머지 → React 빌드(frontend/Dockerfile의 seelo-web 이미지).

# 접근 로그에 비밀 값을 남기지 않는다(05 12장): 쿼리 문자열(OAuth code·state, 메일 티켓)은 빼고,
# 메일 링크 화면 경로의 토큰은 가린다. Referer도 남기지 않는다.
map $uri $seelo_log_uri {
  ~^/verify-email/      /verify-email/***;
  ~^/password/reset/    /password/reset/***;
  default               $uri;
}
log_format seelo '$remote_addr [$time_local] "$request_method $seelo_log_uri" '
                 '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';

server {
  listen 80;
  client_max_body_size 1m;
  access_log /var/log/nginx/access.log seelo;
  # 토큰이 든 화면 주소가 다른 사이트로 Referer에 실려 나가지 않게
  add_header Referrer-Policy "no-referrer" always;

  # api 컨테이너를 다시 만들면 IP가 바뀐다. 시작 때 한 번만 풀면 502가 나므로 Docker DNS로 10초마다 다시 푼다
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/prototype.conf;

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # 배포 커밋 확인용. 화면 이미지와 분리한 폴더에서 제공한다.
  location = /deployment.json {
    alias /usr/share/nginx/meta/deployment.json;
    expires -1;
  }

  # Vite 해시 파일은 오래 캐시한다. 없는 파일은 화면 HTML로 대체하지 않는다.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    try_files $uri =404;
  }

  # React Router 직접 접근·새로고침은 index.html로 보낸다. index는 매번 새로 받는다.
  location / {
    root /usr/share/nginx/html;
    expires -1;
    try_files $uri /index.html;
  }
}
