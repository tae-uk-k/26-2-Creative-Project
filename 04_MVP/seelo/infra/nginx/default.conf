# /api → FastAPI, 나머지 → React 빌드(01 5장). 화면이 생기기 전에는 html/index.html 자리 표시.

# 접근 로그에 비밀 값을 남기지 않는다(05 12장): 쿼리 문자열(OAuth code·state, 메일 티켓)은 빼고,
# 메일 링크 화면 경로의 토큰은 가린다. Referer도 남기지 않는다.
map $uri $seelo_log_uri {
  ~^/verify-email/      /verify-email/***;
  ~^/password/reset/    /password/reset/***;
  default               $uri;
}
log_format seelo '$remote_addr [$time_local] "$request_method $seelo_log_uri" '
                 '$status $body_bytes_sent $request_time "$http_user_agent" $request_id';

server {
  listen 80;
  client_max_body_size 1m;
  access_log /var/log/nginx/access.log seelo;
  # 토큰이 든 화면 주소가 다른 사이트로 Referer에 실려 나가지 않게
  add_header Referrer-Policy "no-referrer" always;

  # api 컨테이너를 다시 만들면 IP가 바뀐다. 시작 때 한 번만 풀면 502가 나므로 Docker DNS로 10초마다 다시 푼다
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/prototype.conf;

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
