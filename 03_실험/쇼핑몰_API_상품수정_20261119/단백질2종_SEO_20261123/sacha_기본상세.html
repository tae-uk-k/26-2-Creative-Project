<p>seelo 사차인치 탈지 단백질 분말 300g</p>
<p>사차인치를 탈지하고 분말로 가공한 식물성 단백질 원료입니다.<br>우유나 두유, 스무디에 조금씩 넣고 충분히 섞어 주세요.</p>
<p>내용량: 300g<br>포장: 지퍼 파우치 1개<br>원재료: 사차인치 탈지 분말</p>
<p>직사광선과 습기를 피해 서늘한 곳에 보관하세요. 개봉 후에는 지퍼를 닫고 물기가 없는 도구를 사용하세요.<br>원재료에 알레르기가 있는 분은 섭취 전에 원재료를 확인하세요.<br>제조원, 원산지, 제조일자, 소비기한 및 영양성분 수치는 확인 후 안내합니다.</p>
