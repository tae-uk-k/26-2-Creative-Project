const files=['01_차분한서비스형.html','02_편집물형.html','03_리포트중심형.html'];const descriptions=['01 / 흰 여백과 남색, 실제 결과를 곁들인 차분한 서비스 소개. 기본 방향으로 추천합니다.','02 / 아이보리 바탕과 명조 제목. 사장님께 말을 건네는, 조금 더 사람다운 편집물.','03 / 짙은 도입부와 넓은 결과 예시. 무엇을 확인할 수 있는지 먼저 보여주는 분석형.'];const tabs=[...document.querySelectorAll('[role=tab]')];function select(i,focus=false){tabs.forEach((b,k)=>{b.setAttribute('aria-selected',String(k===i));b.tabIndex=k===i?0:-1});document.querySelector('iframe').src=files[i];document.querySelector('iframe').title='한눈 랜딩 시안 '+tabs[i].textContent;document.querySelector('#open').href=files[i];document.querySelector('#description').textContent=descriptions[i];history.replaceState(null,'','#'+(i+1));if(focus)tabs[i].focus();}tabs.forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else if(e.key==='Home')n=0;else if(e.key==='End')n=2;else return;e.preventDefault();select(n,true)}});document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{document.querySelector('.viewport').classList.toggle('mobile',b.dataset.device==='mobile');document.querySelectorAll('[data-device]').forEach(x=>x.classList.toggle('active',x===b))});let initial=Number(location.hash.slice(1))-1;if(initial>=0&&initial<3)select(initial);
